[package]
name = "agenttx-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "ACID-compliant gRPC transactional proxy for LLM agent tool execution with snapshot rewinds, dependency-aware rollbacks and Saga compensation."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "../../README.md"
keywords = ["llm", "agents", "grpc", "rocksdb", "saga"]
categories = ["database", "network-programming"]
build = "build.rs"

[lib]
name = "agenttx"
path = "src/lib.rs"

[[bin]]
name = "agenttx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
prost = "0.14"
regex = "1"
rocksdb = { version = "0.25", default-features = false, features = ["lz4", "zstd", "bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio-stream = { version = "0.1", features = ["net"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "io-util", "net"] }
tonic = "0.14"
tonic-health = "0.14"
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"

