name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust · fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

      - name: Benchmark smoke run
        run: cargo run --release --locked -p agenttx-bench -- --quick --out "$RUNNER_TEMP/bench.json"

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck and test
        run: pnpm turbo run lint typecheck test --filter=./apps/* --filter=./packages/*

      - name: Build documentation site
        run: pnpm turbo run build --filter=@agenttx/docs
        env:
          AGENTTX_CONTENT_SOURCE: local
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: rust
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: agenttx:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
