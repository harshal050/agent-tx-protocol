name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      quick:
        description: Run the quick suite (smaller sizes, fewer iterations)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bench:
    name: Run benchmarks and open a results PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install libclang
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev

      - uses: Swatinem/rust-cache@v2

      - name: Run agenttx-bench
        run: >
          cargo run --release --locked -p agenttx-bench --
          ${{ inputs.quick && '--quick' || '' }}
          --out benchmarks/results/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/latest.json

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: bench/update-results
          add-paths: benchmarks/results/latest.json
          commit-message: "chore(bench): update benchmark results"
          title: "chore(bench): update benchmark results"
          body: |
            Automated benchmark run on a GitHub-hosted runner.

            Shared runners are noisier than dedicated hardware; compare against the environment recorded in the JSON before merging.
