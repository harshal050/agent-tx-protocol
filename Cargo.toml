[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/harshal050/agent-tx-protocol"
homepage = "https://agenttx.site"
documentation = "https://agenttx.site/docs"

[profile.release]
lto = "thin"
codegen-units = 1

# Compile RocksDB's C++ optimized even in dev/test builds so latency checks
# (e.g. sub-50ms snapshot restores) reflect real behavior.
[profile.dev.package.librocksdb-sys]
opt-level = 3

[profile.test.package.librocksdb-sys]
opt-level = 3
